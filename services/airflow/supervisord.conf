[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:airflow-webserver]
command=airflow webserver --port 8080
user=airflow
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/airflow-webserver.err.log
stdout_logfile=/var/log/supervisor/airflow-webserver.out.log

[program:airflow-scheduler]
command=airflow scheduler
user=airflow
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/airflow-scheduler.err.log
stdout_logfile=/var/log/supervisor/airflow-scheduler.out.log

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
