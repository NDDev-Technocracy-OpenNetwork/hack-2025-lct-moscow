name: python-ci

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  python-ci:
    name: python-ci
    uses: NDDev-it-com/ci-workflows/.github/workflows/python-ci.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15
    with:
      runner: server-nddev-amsterdam
      python_version: '3.11'
      working_directory: services/backend
      install_command: 'uv pip install --system -r requirements.txt'
      test_command: 'python -m compileall -q app'
