name: python-ci

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  python-ci:
    name: python-ci
    uses: NDDev-Technocracy-OpenNetwork/ci-workflows/.github/workflows/python-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      uv_version: "0.12.23"
      runner: ubuntu-latest
      python_version: '3.11'
      working_directory: services/backend
      install_command: 'uv venv --python 3.11 .venv && uv pip install --python .venv/bin/python -r requirements.txt'
      test_command: ".venv/bin/python -m unittest discover -s tests -v && .venv/bin/python -m compileall -q app"
