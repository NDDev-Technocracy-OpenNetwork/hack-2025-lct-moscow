services:
  # ================================================================================================
  # FRONTEND SERVICE - React Application
  # ================================================================================================
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      - NODE_ENV=${FRONTEND_NODE_ENV}
      - REACT_APP_API_URL=${BACKEND_EXTERNAL_URL}
      - REACT_APP_WS_URL=${WEBSOCKET_EXTERNAL_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FRONTEND_PORT}"]
      interval: ${HEALTHCHECK_INTERVAL_MEDIUM}s
      timeout: ${HEALTHCHECK_TIMEOUT_MEDIUM}s
      retries: ${HEALTHCHECK_RETRIES_MEDIUM}
      start_period: ${HEALTHCHECK_START_PERIOD_MEDIUM}s

  # ================================================================================================
  # BACKEND SERVICE - FastAPI Application
  # ================================================================================================
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      - PYTHONPATH=${PYTHONPATH}
      - DATABASE_URL=${DATABASE_URL}
      - AIRFLOW_DATABASE_URL=${AIRFLOW_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}
      - HDFS_NAMENODE_URL=${HDFS_NAMENODE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
    volumes:
      - ./data:/app/data:rw
      - ./logs/backend:/app/logs:rw
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/health"]
      interval: ${HEALTHCHECK_INTERVAL_MEDIUM}s
      timeout: ${HEALTHCHECK_TIMEOUT_MEDIUM}s
      retries: ${HEALTHCHECK_RETRIES_MEDIUM}
      start_period: ${HEALTHCHECK_START_PERIOD_MEDIUM}s

  # ================================================================================================
  # DLT WORKER SERVICE - ETL Processing
  # ================================================================================================
  dlt-worker:
    build:
      context: ./services/dlt-worker
      dockerfile: Dockerfile
    container_name: ${DLT_WORKER_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    environment:
      - PYTHONPATH=${PYTHONPATH}
      - DATABASE_URL=${DATABASE_URL}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}
      - HDFS_NAMENODE_URL=${HDFS_NAMENODE_URL}
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      namenode:
        condition: service_healthy
    volumes:
      - ./data:/app/data:rw
      - ./logs/dlt-worker:/app/logs:rw
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "python", "-c", "import dlt; print('OK')"]
      interval: ${HEALTHCHECK_INTERVAL_MEDIUM}s
      timeout: ${HEALTHCHECK_TIMEOUT_MEDIUM}s
      retries: ${HEALTHCHECK_RETRIES_MEDIUM}
      start_period: ${HEALTHCHECK_START_PERIOD_MEDIUM}s

  # ================================================================================================
  # POSTGRESQL SERVICE - Database (metadata + destination)
  # ================================================================================================
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${HEALTHCHECK_INTERVAL_SHORT}s
      timeout: ${HEALTHCHECK_TIMEOUT_SHORT}s
      retries: ${HEALTHCHECK_RETRIES_LONG}
      start_period: ${HEALTHCHECK_START_PERIOD_SHORT}s

  # ================================================================================================
  # CLICKHOUSE SERVICE - Analytics Database
  # ================================================================================================
  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    container_name: ${CLICKHOUSE_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_TCP_PORT}:9000"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT}
    volumes:
      - clickhouse_data:/var/lib/clickhouse:rw
      - clickhouse_logs:/var/log/clickhouse-server:rw
      - ./config/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
    networks:
      - bigdata-network
    ulimits:
      nofile:
        soft: ${CLICKHOUSE_ULIMIT_NOFILE_SOFT}
        hard: ${CLICKHOUSE_ULIMIT_NOFILE_HARD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: ${HEALTHCHECK_INTERVAL_MEDIUM}s
      timeout: ${HEALTHCHECK_TIMEOUT_MEDIUM}s
      retries: ${HEALTHCHECK_RETRIES_MEDIUM}
      start_period: ${HEALTHCHECK_START_PERIOD_MEDIUM}s

  # ================================================================================================
  # HDFS NAMENODE SERVICE
  # ================================================================================================
  namenode:
    image: ${HDFS_IMAGE}
    container_name: ${HDFS_NAMENODE_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    ports:
      - "${HDFS_NAMENODE_WEB_PORT}:9870"
      - "${HDFS_NAMENODE_IPC_PORT}:9000"
    volumes:
      - namenode_data:${HDFS_NAMENODE_DATA_DIR}:rw
      - ./logs/hdfs:/opt/hadoop/logs:rw
    environment:
      - CLUSTER_NAME=${HDFS_CLUSTER_NAME}
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=${HADOOP_HTTP_STATIC_USER}
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
      - HDFS_CONF_dfs_replication=${HDFS_REPLICATION_FACTOR}
      - HDFS_CONF_dfs_permissions_enabled=${HDFS_PERMISSIONS_ENABLED}
      - HDFS_CONF_dfs_webhdfs_enabled=${HDFS_WEBHDFS_ENABLED}
      - HDFS_CONF_dfs_namenode_name_dir=${HDFS_NAMENODE_DATA_DIR}
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870/"]
      interval: ${HEALTHCHECK_INTERVAL_MEDIUM}s
      timeout: ${HEALTHCHECK_TIMEOUT_MEDIUM}s
      retries: ${HEALTHCHECK_RETRIES_LONG}
      start_period: ${HEALTHCHECK_START_PERIOD_LONG}s

  # ================================================================================================
  # HDFS DATANODE SERVICE
  # ================================================================================================
  datanode:
    image: ${HDFS_DATANODE_IMAGE}
    container_name: ${HDFS_DATANODE_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    volumes:
      - datanode_data:${HDFS_DATANODE_DATA_DIR}:rw
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=${HDFS_REPLICATION_FACTOR}
      - HDFS_CONF_dfs_datanode_data_dir=${HDFS_DATANODE_DATA_DIR}
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://namenode:9870/dfshealth.html"]
      interval: ${HEALTHCHECK_INTERVAL_MEDIUM}s
      timeout: ${HEALTHCHECK_TIMEOUT_MEDIUM}s
      retries: ${HEALTHCHECK_RETRIES_MEDIUM}
      start_period: ${HEALTHCHECK_START_PERIOD_MEDIUM}s

  # ================================================================================================
  # AIRFLOW INITIALIZATION SERVICE (run once)
  # ================================================================================================
  airflow-init:
    build:
      context: ./services/airflow
      dockerfile: Dockerfile
    container_name: ${AIRFLOW_INIT_CONTAINER_NAME}
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW_EXECUTOR}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW_DATABASE_URL}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY}
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USERNAME}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
      - _AIRFLOW_WWW_USER_EMAIL=${AIRFLOW_ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:rw
      - ./data:/opt/airflow/data:rw
      - ./logs/airflow:/opt/airflow/logs:rw
    networks:
      - bigdata-network
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username ${AIRFLOW_ADMIN_USERNAME} --firstname ${AIRFLOW_ADMIN_FIRSTNAME} --lastname ${AIRFLOW_ADMIN_LASTNAME} --role ${AIRFLOW_ADMIN_ROLE} --email ${AIRFLOW_ADMIN_EMAIL} --password ${AIRFLOW_ADMIN_PASSWORD} || echo 'User exists' &&
        airflow connections add bigdata_postgres --conn-type postgres --conn-host ${POSTGRES_INTERNAL_HOST} --conn-port 5432 --conn-login ${POSTGRES_USER} --conn-password ${POSTGRES_PASSWORD} --conn-schema ${POSTGRES_DB} || echo 'Connection exists'
      "

  # ================================================================================================
  # AIRFLOW WEBSERVER SERVICE
  # ================================================================================================
  airflow-webserver:
    build:
      context: ./services/airflow
      dockerfile: Dockerfile
    container_name: ${AIRFLOW_WEBSERVER_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT}:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW_EXECUTOR}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW_DATABASE_URL}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY}
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=${AIRFLOW_EXPOSE_CONFIG}
      - AIRFLOW__CORE__LOAD_EXAMPLES=${AIRFLOW_LOAD_EXAMPLES}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:rw
      - ./data:/opt/airflow/data:rw
      - ./logs/airflow:/opt/airflow/logs:rw
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: ${HEALTHCHECK_INTERVAL_MEDIUM}s
      timeout: ${HEALTHCHECK_TIMEOUT_MEDIUM}s
      retries: ${HEALTHCHECK_RETRIES_LONG}
      start_period: ${HEALTHCHECK_START_PERIOD_LONG}s

  # ================================================================================================
  # AIRFLOW SCHEDULER SERVICE
  # ================================================================================================
  airflow-scheduler:
    build:
      context: ./services/airflow
      dockerfile: Dockerfile
    container_name: ${AIRFLOW_SCHEDULER_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=${AIRFLOW_EXECUTOR}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW_DATABASE_URL}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=${AIRFLOW_DAGS_PAUSED_AT_CREATION}
      - AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=${AIRFLOW_MAX_ACTIVE_RUNS_PER_DAG}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags:rw
      - ./data:/opt/airflow/data:rw
      - ./logs/airflow:/opt/airflow/logs:rw
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: ${HEALTHCHECK_INTERVAL_MEDIUM}s
      timeout: ${HEALTHCHECK_TIMEOUT_MEDIUM}s
      retries: ${HEALTHCHECK_RETRIES_MEDIUM}
      start_period: ${HEALTHCHECK_START_PERIOD_MEDIUM}s

  # ================================================================================================
  # REDIS SERVICE - Caching and Queues
  # ================================================================================================
  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data:rw
      - ./logs/redis:/var/log/redis:rw
    networks:
      - bigdata-network
    command: redis-server --appendonly ${REDIS_APPENDONLY} --maxmemory ${REDIS_MAXMEMORY} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${HEALTHCHECK_INTERVAL_SHORT}s
      timeout: ${HEALTHCHECK_TIMEOUT_SHORT}s
      retries: ${HEALTHCHECK_RETRIES_MEDIUM}
      start_period: ${HEALTHCHECK_START_PERIOD_SHORT}s

  # ================================================================================================
  # PGADMIN SERVICE - Database Management (Optional)
  # ================================================================================================
  pgadmin:
    image: ${PGADMIN_IMAGE}
    container_name: ${PGADMIN_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=${PGADMIN_CONFIG_SERVER_MODE}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bigdata-network
    profiles:
      - tools

# ================================================================================================
# VOLUMES CONFIGURATION
# ================================================================================================
volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  namenode_data:
    driver: local
  datanode_data:
    driver: local
  redis_data:
    driver: local

# ================================================================================================
# NETWORKS CONFIGURATION
# ================================================================================================
networks:
  bigdata-network:
    driver: bridge